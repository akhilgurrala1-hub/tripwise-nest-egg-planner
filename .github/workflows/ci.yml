name: CI

# Runs on every pull request and on pushes to main (including Lovable's commits),
# so a change that breaks types, lint, tests or the build is caught before it ships.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit -p .

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build

  # The data in src/data (airports, places, cruises) is built and checked by the
  # Python tools in tools/: valid ids, coordinates, vocabulary, an airport for every
  # place suggested for flights, and the canonical one-record-per-line layout.
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Lint and format
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .

      - name: Tests
        run: uv run --locked pytest

      - name: Check data files
        run: uv run --locked python -m waypoint_data check
